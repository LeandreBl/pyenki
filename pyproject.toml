[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyenki"
version = "0.1.0"
description = "Reverse-engineered client for the Leroy Merlin Enki smart-home cloud API"
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-3.0-or-later"
authors = [{ name = "LeandreBl" }]
keywords = ["enki", "leroy-merlin", "home-assistant", "smart-home", "radiator", "iot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = []  # standard library only

[project.urls]
Homepage = "https://github.com/LeandreBl/pyenki"
Source = "https://github.com/LeandreBl/pyenki"

[project.scripts]
pyenki = "pyenki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
