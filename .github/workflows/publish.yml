name: Publish to PyPI

# Trusted Publishing (OIDC): no API token needed. On PyPI, configure the
# publisher with workflow filename "publish.yml" and environment "pypi".
on:
  release:
    types: [published]
  workflow_dispatch:        # manual run from the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi            # must match the "environment name" set on PyPI
    permissions:
      id-token: write            # required for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
